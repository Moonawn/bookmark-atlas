[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bookmark-atlas"
version = "0.2.0"
description = "Local-first, extensible bookmark archiving with dual X collection adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Moonawn"}]
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
browser = ["browser-cookie3>=0.20,<0.21"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
bookmark-atlas = "bookmark_atlas.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
